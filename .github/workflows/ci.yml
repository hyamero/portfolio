name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# A PR branch triggers both `push` and `pull_request`; keep only the newest run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Versions come from package.json (`packageManager` and `engines.node`).
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build project
        run: bun run build
