name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Superseded runs on a branch or PR are cancelled; every commit on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Same-repo branches are covered by `push`; `pull_request` only adds fork
    # PRs, so each commit gets one run instead of a push run plus a cancelled PR run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Versions come from package.json (`packageManager` and `engines.node`).
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build project
        run: bun run build
