version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all non-breaking bumps; majors still arrive individually.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Staying on TS 5.9 until Next's editor plugin works with TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Types track the Node runtime pinned in `engines.node`.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
